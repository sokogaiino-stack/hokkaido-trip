<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北海道 修学旅行ガイド</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
      background-color: #ffffff;
      color: #333333;
      margin: 0;
      padding: 0;
      letter-spacing: 0.05em;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #eeeeee;
    }
    h1 {
      margin: 0;
      font-size: 1.4em;
      font-weight: 500;
      letter-spacing: 0.1em;
    }
    .subtitle {
      font-size: 0.85em;
      color: #888888;
      margin-top: 10px;
    }
    .container {
      padding: 30px 20px;
      max-width: 600px;
      margin: auto;
    }
    .area-section {
      margin-bottom: 40px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.1em;
      font-weight: 500;
      border-bottom: 1px solid #333333;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      gap: 15px;
    }
    .btn {
      flex: 1;
      text-align: center;
      background-color: #ffffff;
      color: #333333;
      text-decoration: none;
      padding: 15px;
      font-size: 0.9em;
      border: 1px solid #dddddd;
      transition: all 0.3s ease;
    }
    .btn:hover {
      border-color: #333333;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <header>
    <h1>HOKKAIDO TRIP GUIDE</h1>
    <p class="subtitle">移動中や自由行動のヒントに</p>
  </header>
  <div class="container">
    
    <div class="area-section">
      <h2>SAPPORO</h2>
      <div class="button-group">
        <a href="sapporo_go.html" class="btn">行きたい</a>
        <a href="sapporo_eat.html" class="btn">食べたい</a>
      </div>
    </div>

    <div class="area-section">
      <h2>OTARU</h2>
      <div class="button-group">
        <a href="otaru_go.html" class="btn">行きたい</a>
        <a href="otaru_eat.html" class="btn">食べたい</a>
      </div>
    </div>

    <div class="area-section">
      <h2>NEW CHITOSE AIRPORT</h2>
      <div class="button-group">
        <a href="chitose_now.html" class="btn">今食べたい</a>
        <a href="chitose_souvenir.html" class="btn">お土産</a>
      </div>
    </div>

  </div>
</body>
</html>
